<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFBF7" />
    <title>Hill Store — Comfort &amp; Care for babies in Kigali</title>
    <meta
      name="description"
      content="Gentle, genuine products for babies and infants, delivered across Kigali — including the tiny sizes and careful essentials that are hard to find in Rwanda."
    />
    <link rel="canonical" href="https://www.hill-store.com/" />

    <!-- Starts fetching the hero badge (the homepage's LCP image) before
         React even mounts — same srcset/sizes as the <img> in HeroScene.tsx
         so the browser caches the exact candidate it'll actually render. -->
    <link
      rel="preload"
      as="image"
      href="/brand/hero-baby-700.webp"
      imagesrcset="/brand/hero-baby-700.webp 700w, /brand/hero-baby-1100.webp 1100w"
      imagesizes="(max-width: 1024px) 80vw, 32rem"
    />

    <!-- Static fallback for crawlers that don't execute JavaScript (some
         social-preview bots). Every route also sets its own version of these
         at runtime via src/hooks/useSeo.ts, which is what Google's crawler
         (which does run JS) actually sees. -->
    <meta property="og:site_name" content="Hill Store" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hill-store.com/" />
    <meta property="og:title" content="Hill Store — Comfort &amp; Care for babies in Kigali" />
    <meta
      property="og:description"
      content="Gentle, genuine products for babies and infants, delivered across Kigali — including the tiny sizes and careful essentials that are hard to find in Rwanda."
    />
    <meta property="og:image" content="https://www.hill-store.com/brand/hero-baby-1100.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hill Store — Comfort &amp; Care for babies in Kigali" />
    <meta
      name="twitter:description"
      content="Gentle, genuine products for babies and infants, delivered across Kigali — including the tiny sizes and careful essentials that are hard to find in Rwanda."
    />
    <meta name="twitter:image" content="https://www.hill-store.com/brand/hero-baby-1100.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
